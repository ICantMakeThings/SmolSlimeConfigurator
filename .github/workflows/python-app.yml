name: Build SmolSlimeConfigurator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: SmolSlime-Linux
            executable: SmolSlimeConfigurator-Linux
          - os: macos-latest
            artifact: SmolSlime-macOS
            executable: SmolSlimeConfigurator-macOS
          - os: windows-latest
            artifact: SmolSlime-Windows
            executable: SmolSlimeConfigurator-Windows
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        shell: bash
        run: |
          icon_args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            icon_args+=(--icon icon.icns)
          fi
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name ${{ matrix.executable }} \
            --collect-all PySide6 \
            --add-data "Main.qml${{ runner.os == 'Windows' && ';' || ':' }}." \
            --add-data "ActionButton.qml${{ runner.os == 'Windows' && ';' || ':' }}." \
            --add-data "icon.png${{ runner.os == 'Windows' && ';' || ':' }}." \
            "${icon_args[@]}" \
          SmolSlimeConfiguratorV10.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.executable }}*
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: SmolSlime-*
          path: release-assets

      - name: Attach builds to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*